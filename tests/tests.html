<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLM's Angry Alien — Automated Tests</title>
<style>
  body { font: 13px/1.6 Consolas, monospace; background: #060913; color: #b8c4ee; margin: 24px; }
  h1 { color: #b6ff5e; font-size: 18px; }
  #result { font-size: 16px; font-weight: bold; margin: 12px 0; padding: 10px 14px; border-radius: 8px; }
  .pass { background: #0d2b10; color: #8aff7a; border: 1px solid #2c9e1e; }
  .fail { background: #33110d; color: #ff8a7a; border: 1px solid #a11414; }
  canvas { display: none; }
</style>
</head>
<body>
<h1>GLM's Angry Alien — Automated Test Suite (browser)</h1>
<div id="result">running…</div>
<pre id="out"></pre>
<!-- real game modules -->
<script src="../js/core/rng.js"></script>
<script src="../js/core/collide.js"></script>
<script src="../js/core/waves.js"></script>
<script src="../js/core/score.js"></script>
<script src="../js/config.js"></script>
<script src="../js/save.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/sprites.js"></script>
<script src="../js/background.js"></script>
<script src="../js/entities.js"></script>
<script src="../js/game.js"></script>
<!-- suite -->
<script src="suite.js"></script>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out');
  // real offscreen canvas context = strongest smoke test
  var off = document.createElement('canvas');
  off.width = 480; off.height = 800;
  window.__makeFakeCtx = function () { return off.getContext('2d'); };

  var result = window.AAsuite.runSuite(window.AA, function (line) {
    out.appendChild(document.createTextNode(line + '\n'));
  });
  var el = document.getElementById('result');
  el.textContent = 'RESULTS: ' + result.passed + ' passed, ' + result.failed + ' failed, ' + result.total + ' total — ' +
    (result.failed ? 'FAIL' : 'ALL TESTS PASSED');
  el.className = result.failed ? 'fail' : 'pass';
  window.testResults = result;
})();
</script>
</body>
</html>
